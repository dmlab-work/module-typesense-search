name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer validate

      - name: Well-formed XML
        run: |
          find . -name '*.xml' -not -path './vendor/*' -print0 | xargs -0 php -r '
            foreach (array_slice($argv, 1) as $file) {
                if (!(new DOMDocument())->load($file)) { fwrite(STDERR, "Malformed XML: $file\n"); exit(1); }
            }' --

      - name: Magento coding standard
        run: |
          composer create-project -q --no-interaction --no-progress magento/magento-coding-standard "$RUNNER_TEMP/mcs"
          "$RUNNER_TEMP/mcs/vendor/bin/phpcs" --standard=Magento2 --extensions=php,phtml \
            --ignore='*/vendor/*' --runtime-set ignore_warnings_on_exit 1 .

  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, soap, sodium, xsl, zip
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}

      # Magento packages come from the public Mage-OS mirror: no repo.magento.com keys needed.
      - name: Configure Magento packages
        run: |
          composer config repositories.mage-os composer https://mirror.mage-os.org/
          composer config --no-plugins allow-plugins.magento/magento-composer-installer false
          composer config --no-plugins allow-plugins.magento/composer-dependency-version-audit-plugin false

      - uses: ramsey/composer-install@v4

      - name: PHPUnit
        run: vendor/bin/phpunit -c Test/Unit/phpunit.xml ${{ matrix.php == '8.4' && '--coverage-clover coverage.xml' || '' }}

      - uses: codecov/codecov-action@v7
        if: matrix.php == '8.4'
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
